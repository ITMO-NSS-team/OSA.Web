[server]

# Max size, in megabytes, for files uploaded with the file_uploader.
#
# Default: 200
maxUploadSize = 25

# Poll for source changes to avoid exhausting Linux's inotify watch limit.
fileWatcherType = "poll"

[theme]
base = "light"
primaryColor = "#171717"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EDEDED"
textColor = "#171717"
linkColor = "#171717"
borderColor = "#A0A0A0"
codeBackgroundColor = "#E8E8E8"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"

[theme.sidebar]
primaryColor = "#F5F5F5"
backgroundColor = "#191919"
secondaryBackgroundColor = "#303030"
textColor = "#FAFAFA"
linkColor = "#FAFAFA"
borderColor = "#4B4B4B"

