[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osa-web"
version = "0.3.0"
description = "Streamlit web interface for the OSA tool."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "Authlib==1.6.0",
    "osa-tool==0.2.6",
    "paramiko==3.5.1",
    "python-dotenv==1.0.1",
    "streamlit==1.48.1",
    "toml",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osa_web = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
