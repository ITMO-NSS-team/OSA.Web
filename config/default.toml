[versions]

osa_web = "0.3.0"

[paths]

log = "runtime/logs/osa_web.logs"
tmp = "runtime/tmp"

################################################################
############################# FAST #############################
################################################################

[fast.general]
translate-dirs = false
translate-readme = ""
convert-notebooks = ""
ensure-license = ""
community-docs = false
docstring = false
report = true
readme = true
refine-readme = false
requirements = true
organize = false
about = true
validate-paper = false
validate-doc = false

[fast.git]
branch = ""
no-fork = false
no-pull-request = false

[fast.llm]
api = "itmo"
base-url = "https://openrouter.ai/api/v1"
model = "google/gemini-2.5-flash"
temperature = 0.05
max-tokens = 4096
context-window = 200000
top-p = 0.95

[fast.workflows]
generate-workflows = false
include-tests = true
include-black = true
include-pep8 = true
include-autopep8 = false
include-fix-pep8 = false
include-pypi = false
python-versions = ["3.8", "3.9", "3.10"]
pep8-tool = "flake8"
use-poetry = false
branches = ""
codecov-token = false
include-codecov = false

################################################################
########################### QUALITY ############################
################################################################

[quality.general]
translate-dirs = false
translate-readme = "Russian"
convert-notebooks = ""
ensure-license = ""
community-docs = true
docstring = true
report = true
readme = true
refine-readme = true
requirements = true
organize = false
about = true
validate-paper = false
validate-doc = false

[quality.git]
branch = ""
no-fork = false
no-pull-request = false

[quality.llm]
api = "itmo"
base-url = "https://openrouter.ai/api/v1"
model = "anthropic/claude-haiku-4.5"
temperature = 0.05
max-tokens = 4096
context-window = 200000
top-p = 0.95

[quality.workflows]
generate-workflows = true
include-tests = true
include-black = true
include-pep8 = true
include-autopep8 = false
include-fix-pep8 = false
include-pypi = false
python-versions = ["3.8", "3.9", "3.10"]
pep8-tool = "flake8"
use-poetry = false
branches = ""
codecov-token = false
include-codecov = false
